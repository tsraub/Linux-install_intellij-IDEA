
---
- name: Install or update IntelliJ IDEA
  hosts: all
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    # IntelliJ version
    idea_version: "2026.2.4"

    # Download configuration
    intellij_url: "https://download.jetbrains.com/idea/idea-{{ idea_version }}.tar.gz"
    intellij_checksum: ""  # Add verified SHA256 checksum before deployment

    # Installation paths
    intellij_versioned_dir: "/opt/intellij-{{ idea_version }}"
    intellij_current_link: "/opt/intellij"
    intellij_archive_path: "/tmp/idea-{{ idea_version }}.tar.gz"

    # Desktop integration
    intellij_launcher_symlink: "/usr/local/bin/idea"
    desktop_file_path: "/usr/share/applications/jetbrains-idea.desktop"
    icon_dest_path: "/usr/share/pixmaps/jetbrains-idea.png"

  pre_tasks:

    - name: Verify privilege escalation
      ansible.builtin.command:
        cmd: id -u
      register: uid_check
      changed_when: false

    - name: Fail if privilege escalation is inactive
      ansible.builtin.fail:
        msg: "Privilege escalation is not active. Enable sudo/become."
      when: uid_check.stdout != "0"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.pkg_mgr == "apt"

  tasks:

    # --------------------------------------------------
    # Install dependencies
    # --------------------------------------------------

    - name: Install required tools on Debian or Ubuntu
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - desktop-file-utils
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Install required tools on RHEL family
      ansible.builtin.yum:
        name:
          - curl
          - tar
          - desktop-file-utils
        state: present
      when: ansible_facts.os_family == "RedHat"

    # --------------------------------------------------
    # Prepare installation
    # --------------------------------------------------

    - name: Create IntelliJ base directory
      ansible.builtin.file:
        path: "/opt"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download IntelliJ IDEA archive
      ansible.builtin.get_url:
        url: "{{ intellij_url }}"
        dest: "{{ intellij_archive_path }}"
        owner: root
        group: root
        mode: "0644"
        force: false
        checksum: "{{ intellij_checksum if intellij_checksum | length > 0 else omit }}"

    # --------------------------------------------------
    # Install IntelliJ
    # --------------------------------------------------

    - name: Check existing target installation
      ansible.builtin.command:
        cmd: "{{ intellij_versioned_dir }}/bin/idea.sh --version"
      register: existing_intellij
      changed_when: false
      failed_when: false

    - name: Remove incomplete or incorrect target installation
      ansible.builtin.file:
        path: "{{ intellij_versioned_dir }}"
        state: absent
      when: >
        existing_intellij.rc != 0 or
        idea_version not in existing_intellij.stdout

    - name: Create target IntelliJ directory
      ansible.builtin.file:
        path: "{{ intellij_versioned_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract IntelliJ IDEA
      ansible.builtin.unarchive:
        src: "{{ intellij_archive_path }}"
        dest: "{{ intellij_versioned_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        creates: "{{ intellij_versioned_dir }}/bin/idea.sh"

    # --------------------------------------------------
    # Verify installation before switching
    # --------------------------------------------------

    - name: Verify new IntelliJ installation
      ansible.builtin.command:
        cmd: "{{ intellij_versioned_dir }}/bin/idea.sh --version"
      register: installed_intellij
      changed_when: false
      failed_when: false

    - name: Stop if expected IntelliJ version is not installed
      ansible.builtin.assert:
        that:
          - installed_intellij.rc == 0
          - idea_version in installed_intellij.stdout
        fail_msg: >
          IntelliJ {{ idea_version }} verification failed.
          Existing installations will not be removed.
        success_msg: >
          IntelliJ {{ idea_version }} verified successfully.

    # --------------------------------------------------
    # Update symlinks
    # --------------------------------------------------

    - name: Update stable IntelliJ symlink
      ansible.builtin.file:
        src: "{{ intellij_versioned_dir }}"
        dest: "{{ intellij_current_link }}"
        state: link
        owner: root
        group: root
        force: true

    - name: Update IntelliJ launcher symlink
      ansible.builtin.file:
        src: "{{ intellij_current_link }}/bin/idea.sh"
        dest: "{{ intellij_launcher_symlink }}"
        state: link
        force: true

    # --------------------------------------------------
    # Desktop integration
    # --------------------------------------------------

    - name: Install IntelliJ icon
      ansible.builtin.copy:
        src: "{{ intellij_current_link }}/bin/idea.png"
        dest: "{{ icon_dest_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Install IntelliJ desktop entry
      ansible.builtin.copy:
        dest: "{{ desktop_file_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=IntelliJ IDEA Ultimate
          Comment=Capable and ergonomic IDE for JVM/Android development
          Exec=/usr/local/bin/idea %f
          Icon=/usr/share/pixmaps/jetbrains-idea.png
          Terminal=false
          Categories=Development;IDE;Java;
          StartupNotify=true
          StartupWMClass=jetbrains-idea
          MimeType=text/x-java;text/x-groovy;text/x-kotlin;application/x-java-archive;
          X-Desktop-File-Install-Version=0.26

    - name: Update desktop database
      ansible.builtin.command:
        cmd: update-desktop-database /usr/share/applications
      changed_when: false
      failed_when: false

    # --------------------------------------------------
    # Remove old IntelliJ installations
    # --------------------------------------------------

    - name: Find previous IntelliJ installations
      ansible.builtin.find:
        paths: /opt
        patterns: "intellij-*"
        file_type: directory
        recurse: false
      register: old_intellij_installs

    - name: Remove previous IntelliJ installations
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_intellij_installs.files }}"
      when: item.path != intellij_versioned_dir
      loop_control:
        label: "{{ item.path }}"

    - name: Remove downloaded IntelliJ archive
      ansible.builtin.file:
        path: "{{ intellij_archive_path }}"
        state: absent

    # --------------------------------------------------
    # Final verification
    # --------------------------------------------------

    - name: Verify active IntelliJ version
      ansible.builtin.command:
        cmd: "{{ intellij_current_link }}/bin/idea.sh --version"
      register: final_intellij
      changed_when: false

    - name: Verify active IntelliJ symlink
      ansible.builtin.command:
        cmd: "readlink -f {{ intellij_current_link }}"
      register: final_link
      changed_when: false

    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "IntelliJ IDEA {{ idea_version }} installed successfully."
          - "Installed version: {{ final_intellij.stdout }}"
          - "Installation: {{ intellij_versioned_dir }}"
          - "Stable link: {{ final_link.stdout }}"
          - "Launcher: {{ intellij_launcher_symlink }}"
          - "Previous IntelliJ installations removed."
