- name: Install or update IntelliJ IDEA
  hosts: all
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    idea_version: "2026.2.3"
    intellij_versioned_dir: "/opt/intellij-2026.2.3"
    intellij_current_link: "/opt/intellij"
    intellij_archive_path: "/tmp/idea-2026.2.3.tar.gz"

    intellij_url: "https://download.jetbrains.com/idea/idea-2026.2.3.tar.gz"
    intellij_checksum: "sha256:68751c8ae4d49407251cd197df795fbed91b6fdc85d10c73c4649a99e496ab37"

    intellij_launcher_symlink: "/usr/local/bin/idea"
    desktop_file_path: "/usr/share/applications/jetbrains-idea.desktop"
    icon_dest_path: "/usr/share/pixmaps/jetbrains-idea.png"

  pre_tasks:
    - name: Verify privilege escalation
      ansible.builtin.command:
        cmd: id -u
      register: uid_check
      changed_when: false

    - name: Fail if privilege escalation is inactive
      ansible.builtin.fail:
        msg: "Privilege escalation is not active. Enable sudo/become."
      when: uid_check.stdout != "0"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.pkg_mgr == "apt"

  tasks:
    - name: Install required tools on Debian or Ubuntu
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - desktop-file-utils
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Install required tools on RHEL family
      ansible.builtin.yum:
        name:
          - curl
          - tar
          - desktop-file-utils
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Create IntelliJ base directory
      ansible.builtin.file:
        path: "/opt"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download IntelliJ IDEA archive
      ansible.builtin.get_url:
        url: "https://download.jetbrains.com/idea/idea-2026.2.3.tar.gz"
        dest: "/tmp/idea-2026.2.3.tar.gz"
        owner: root
        group: root
        mode: "0644"
        checksum: "sha256:68751c8ae4d49407251cd197df795fbed91b6fdc85d10c73c4649a99e496ab37"
        force: false

    - name: Check existing target installation
      ansible.builtin.command:
        cmd: "/opt/intellij-2026.2.3/bin/idea.sh --version"
      register: existing_intellij
      changed_when: false
      failed_when: false

    - name: Remove incomplete or incorrect target installation
      ansible.builtin.file:
        path: "/opt/intellij-2026.2.3"
        state: absent
      when:
        - existing_intellij.rc != 0 or "2026.2.3" not in existing_intellij.stdout

    - name: Create target IntelliJ directory
      ansible.builtin.file:
        path: "/opt/intellij-2026.2.3"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract IntelliJ IDEA
      ansible.builtin.unarchive:
        src: "/tmp/idea-2026.2.3.tar.gz"
        dest: "/opt/intellij-2026.2.3"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        creates: "/opt/intellij-2026.2.3/bin/idea.sh"

    - name: Verify
