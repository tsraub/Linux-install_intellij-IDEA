
---
- name: Remediate vulnerable IntelliJ IDEA installations
  hosts: all
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:
    # Required fixed version
    idea_version: "2026.3"

    # Previous vulnerable version
    old_idea_version: "2026.2.4"

    # Download configuration
    intellij_url: "https://download.jetbrains.com/idea/idea-{{ idea_version }}.tar.gz"
    intellij_checksum: ""  # Populate with verified SHA256 if available

    # Installation paths
    intellij_versioned_dir: "/opt/intellij-{{ idea_version }}"
    intellij_current_link: "/opt/intellij"
    intellij_archive_path: "/tmp/idea-{{ idea_version }}.tar.gz"

    # Desktop integration
    intellij_launcher_symlink: "/usr/local/bin/idea"
    desktop_file_path: "/usr/share/applications/jetbrains-idea.desktop"
    icon_dest_path: "/usr/share/pixmaps/jetbrains-idea.png"

    # Known vulnerable installation
    old_intellij_dir: "/opt/intellij-{{ old_idea_version }}"

  pre_tasks:

    - name: Verify privilege escalation
      ansible.builtin.command:
        cmd: id -u
      register: uid_check
      changed_when: false

    - name: Fail if privilege escalation is inactive
      ansible.builtin.fail:
        msg: "Root privileges are required."
      when: uid_check.stdout != "0"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == "Debian"

  tasks:

    # --------------------------------------------------
    # Install dependencies
    # --------------------------------------------------

    - name: Install required tools on Debian/Ubuntu
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - desktop-file-utils
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Install required tools on RHEL family
      ansible.builtin.dnf:
        name:
          - curl
          - tar
          - desktop-file-utils
        state: present
      when: ansible_facts.os_family == "RedHat"

    # --------------------------------------------------
    # Download IntelliJ 2026.3
    # --------------------------------------------------

    - name: Create IntelliJ base directory
      ansible.builtin.file:
        path: /opt
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download IntelliJ IDEA 2026.3
      ansible.builtin.get_url:
        url: "{{ intellij_url }}"
        dest: "{{ intellij_archive_path }}"
        owner: root
        group: root
        mode: "0644"
        force: true
        checksum: "{{ 'sha256:' ~ intellij_checksum if intellij_checksum | length > 0 else omit }}"
      register: intellij_download

    - name: Verify downloaded archive exists
      ansible.builtin.stat:
        path: "{{ intellij_archive_path }}"
      register: archive_stat

    - name: Fail if archive is missing or empty
      ansible.builtin.assert:
        that:
          - archive_stat.stat.exists
          - archive_stat.stat.size | int > 0
        fail_msg: "IntelliJ IDEA archive download failed."

    # --------------------------------------------------
    # Check existing target installation
    # --------------------------------------------------

    - name: Check existing IntelliJ 2026.3 installation
      ansible.builtin.command:
        cmd: "{{ intellij_versioned_dir }}/bin/idea.sh --version"
      register: existing_intellij
      changed_when: false
      failed_when: false

    - name: Remove incomplete or incorrect target installation
      ansible.builtin.file:
        path: "{{ intellij_versioned_dir }}"
        state: absent
      when: >
        existing_intellij.rc != 0 or
        ('2026.3' not in existing_intellij.stdout)

    # --------------------------------------------------
    # Extract IntelliJ 2026.3
    # --------------------------------------------------

    - name: Create target installation directory
      ansible.builtin.file:
        path: "{{ intellij_versioned_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract IntelliJ IDEA 2026.3
      ansible.builtin.unarchive:
        src: "{{ intellij_archive_path }}"
        dest: "{{ intellij_versioned_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        creates: "{{ intellij_versioned_dir }}/bin/idea.sh"
      when: >
        existing_intellij.rc != 0 or
        ('2026.3' not in existing_intellij.stdout)

    # --------------------------------------------------
    # Verify new installation
    # --------------------------------------------------

    - name: Verify IntelliJ 2026.3 installation
      ansible.builtin.command:
        cmd: "{{ intellij_versioned_dir }}/bin/idea.sh --version"
      register: installed_intellij
      changed_when: false

    - name: Confirm fixed IntelliJ version
      ansible.builtin.assert:
        that:
          - installed_intellij.rc == 0
          - installed_intellij.stdout is search('2026\.3(\D|$)')
        fail_msg: >
          IntelliJ 2026.3 verification failed.
          Detected version: {{ installed_intellij.stdout }}
        success_msg: >
          IntelliJ IDEA 2026.3 successfully verified.

    # --------------------------------------------------
    # Protect existing installation before switching
    # --------------------------------------------------

    - name: Check current IntelliJ path
      ansible.builtin.stat:
        path: "{{ intellij_current_link }}"
        follow: false
      register: current_link_stat

    - name: Protect existing real installation directory
      ansible.builtin.assert:
        that:
          - >
            not current_link_stat.stat.exists or
            current_link_stat.stat.islnk
        fail_msg: >
          /opt/intellij is an actual directory, not a symlink.
          Manual migration is required before switching installations.

    # --------------------------------------------------
    # Switch active IntelliJ installation
    # --------------------------------------------------

    - name: Update stable IntelliJ symlink
      ansible.builtin.file:
        src: "{{ intellij_versioned_dir }}"
        dest: "{{ intellij_current_link }}"
        state: link
        owner: root
        group: root
        force: true

    - name: Update IntelliJ launcher symlink
      ansible.builtin.file:
        src: "{{ intellij_current_link }}/bin/idea.sh"
        dest: "{{ intellij_launcher_symlink }}"
        state: link
        force: true

    # --------------------------------------------------
    # Desktop integration
    # --------------------------------------------------

    - name: Install IntelliJ icon
      ansible.builtin.copy:
        src: "{{ intellij_current_link }}/bin/idea.png"
        dest: "{{ icon_dest_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Install IntelliJ desktop entry
      ansible.builtin.copy:
        dest: "{{ desktop_file_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=IntelliJ IDEA
          Comment=JetBrains IntelliJ IDEA
          Exec=/usr/local/bin/idea %f
          Icon=/usr/share/pixmaps/jetbrains-idea.png
          Terminal=false
          Categories=Development;IDE;Java;
          StartupNotify=true
          StartupWMClass=jetbrains-idea
          MimeType=text/x-java;text/x-groovy;text/x-kotlin;application/x-java-archive;

    - name: Update desktop database
      ansible.builtin.command:
        cmd: update-desktop-database /usr/share/applications
      changed_when: false
      failed_when: false

    # --------------------------------------------------
    # Verify active installation BEFORE cleanup
    # --------------------------------------------------

    - name: Verify active IntelliJ version
      ansible.builtin.command:
        cmd: "{{ intellij_current_link }}/bin/idea.sh --version"
      register: final_intellij
      changed_when: false

    - name: Verify active IntelliJ symlink
      ansible.builtin.command:
        cmd: "readlink -f {{ intellij_current_link }}"
      register: final_link
      changed_when: false

    - name: Assert active version is fixed
      ansible.builtin.assert:
        that:
          - final_intellij.rc == 0
          - final_intellij.stdout is search('2026\.3(\D|$)')
          - final_link.stdout == intellij_versioned_dir
        fail_msg: >
          Active IntelliJ verification failed.
          The old installation will not be removed.

    # --------------------------------------------------
    # Remove vulnerable installation
    # --------------------------------------------------

    - name: Check old vulnerable installation
      ansible.builtin.stat:
        path: "{{ old_intellij_dir }}"
      register: old_install_stat

    - name: Remove old vulnerable IntelliJ installation
      ansible.builtin.file:
        path: "{{ old_intellij_dir }}"
        state: absent
      when:
        - old_install_stat.stat.exists
        - old_install_stat.stat.isdir

    # --------------------------------------------------
    # Remove downloaded archive
    # --------------------------------------------------

    - name: Remove downloaded IntelliJ archive
      ansible.builtin.file:
        path: "{{ intellij_archive_path }}"
        state: absent

    # --------------------------------------------------
    # Final remediation verification
    # --------------------------------------------------

    - name: Check old installation is removed
      ansible.builtin.stat:
        path: "{{ old_intellij_dir }}"
      register: old_install_final

    - name: Verify active IntelliJ installation again
      ansible.builtin.command:
        cmd: "{{ intellij_current_link }}/bin/idea.sh --version"
      register: remediation_version
      changed_when: false

    - name: Final remediation assertion
      ansible.builtin.assert:
        that:
          - remediation_version.rc == 0
          - remediation_version.stdout is search('2026\.3(\D|$)')
          - not old_install_final.stat.exists
        fail_msg: >
          IntelliJ vulnerability remediation verification failed.
          Check the installation paths and version.
        success_msg: >
          SUCCESS: IntelliJ IDEA 2026.3 is active.
          Vulnerable IntelliJ 2026.2.4 installation removed.

    - name: Display remediation summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Remediation: SUCCESS"
          - "Required version: {{ idea_version }}"
          - "Installed version: {{ remediation_version.stdout }}"
          - "Installation: {{ intellij_versioned_dir }}"
          - "Active symlink: {{ final_link.stdout }}"
          - "Old vulnerable installation removed: YES"
